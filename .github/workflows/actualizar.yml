
name: Actualizar agenda deportiva

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recopilar eventos deportivos
        run: python actualizar_agenda.py

      - name: Guardar agenda actualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agenda.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar agenda deportiva"
            git push
          fi
