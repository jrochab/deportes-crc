name: Actualizar agenda

on:
  workflow_dispatch:        # permite ejecutarlo a mano con un botón
  schedule:
    - cron: "0 */6 * * *"   # y automáticamente cada 6 horas

permissions:
  contents: write           # necesario para guardar agenda.json

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar el script
        run: python actualizar_agenda.py

      - name: Guardar agenda.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add agenda.json
          if git diff --cached --quiet; then
            echo "Sin cambios en agenda.json"
          else
            git commit -m "Actualizar agenda"
            git push
          fi
